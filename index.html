<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F5E4A" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <meta name="description" content="Saudi Trip Checklist — packing list for leisure, business, and Umrah" />
  <title>Saudi Trip Checklist</title>
  <style>
    /* ========== Design tokens ========== */
    :root {
      --bg: #FAF7F2;
      --bg-elevated: #FFFFFF;
      --bg-muted: #F0EBE3;
      --text: #2B2B2B;
      --text-muted: #6B6560;
      --accent: #1F5E4A;
      --accent-hover: #174A3A;
      --accent-soft: rgba(31, 94, 74, 0.12);
      --border: #E4DDD3;
      --danger: #A63D3D;
      --danger-soft: rgba(166, 61, 61, 0.1);
      --shadow-soft: 0 1px 2px rgba(43, 43, 43, 0.04);
      --radius: 14px;
      --radius-sm: 10px;
      --header-h: auto;
      --tap: 44px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --bg-elevated: #1E1C19;
        --bg-muted: #2A2723;
        --text: #F2EDE6;
        --text-muted: #A39B91;
        --accent: #3D9B7A;
        --accent-hover: #4FB08C;
        --accent-soft: rgba(61, 155, 122, 0.18);
        --border: #3A3530;
        --danger: #E07A7A;
        --danger-soft: rgba(224, 122, 122, 0.15);
        --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
    }

    /* ========== Base ========== */
    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100dvh;
    }

    button, input { font: inherit; color: inherit; }

    /* ========== Layout ========== */
    .app {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 16px 96px;
    }

    /* ========== Sticky header ========== */
    .header {
      position: sticky;
      top: 0;
      z-index: 40;
      margin: 0 -16px;
      padding: 14px 16px 12px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.1rem, 4vw, 1.35rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .weather-note {
      margin: 4px 0 0;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-ghost {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 600;
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
    }

    .btn-ghost:hover { color: var(--text); }

    .btn-ghost:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Progress */
    .progress-block {
      margin-top: 4px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .progress-meta .pct {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 10px;
      border-radius: 999px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 0.35s var(--ease);
    }

    /* ========== View tabs ========== */
    .view-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 14px 0 10px;
      padding: 4px;
      border-radius: 999px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
    }

    .view-tab {
      min-height: 42px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 650;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
    }

    .view-tab[aria-pressed="true"] {
      background: var(--bg-elevated);
      color: var(--accent);
      box-shadow: var(--shadow-soft);
    }

    .view-tab:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .panel {
      display: none;
    }

    .panel.is-active {
      display: block;
    }

    #guidePanel {
      padding-bottom: 8px;
    }

    /* ========== Toolbar ========== */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 10px;
    }

    .filters {
      display: inline-flex;
      padding: 4px;
      border-radius: 999px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      gap: 2px;
    }

    .filter-btn {
      min-height: 40px;
      padding: 0 14px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8125rem;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);
    }

    .filter-btn:hover { color: var(--text); }

    .filter-btn[aria-pressed="true"] {
      background: var(--bg-elevated);
      color: var(--accent);
      box-shadow: var(--shadow-soft);
    }

    .filter-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .filter-btn:active { transform: scale(0.97); }

    .btn-details {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 600;
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
    }

    .btn-details[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
    }

    .btn-details:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Hide extra notes unless details mode is on — bag tags always show */
    .app:not(.details-on) .item-hint { display: none; }
    .app:not(.details-on) .cat-note { display: none; }
    .app:not(.details-on) .add-row { display: none; }

    /* ========== Packing guide ========== */
    .packing-guide {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      width: 100%;
    }

    .guide-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      width: 100%;
      box-sizing: border-box;
    }

    .guide-section {
      display: block;
      width: 100%;
    }

    .guide-section + .guide-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .guide-section h2 {
      margin: 0 0 4px;
      font-size: 1rem;
      letter-spacing: -0.01em;
      font-weight: 700;
    }

    .guide-section > p {
      margin: 0 0 14px;
      font-size: 0.8125rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .allowance-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }

    .allowance-pill {
      text-align: center;
      padding: 12px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-muted);
      min-width: 0;
    }

    .allowance-pill strong {
      display: block;
      font-size: clamp(1rem, 4vw, 1.25rem);
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .allowance-pill span {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.2;
    }

    .wardrobe-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }

    @media (max-width: 420px) {
      .wardrobe-grid { grid-template-columns: 1fr; }
    }

    .wardrobe-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-muted);
      border: 1px solid var(--border);
      font-size: 0.8125rem;
      min-width: 0;
    }

    .wardrobe-stat span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wardrobe-stat em {
      font-style: normal;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .guide-tip {
      margin: 12px 0 0;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      font-size: 0.8125rem;
      color: var(--text);
      line-height: 1.4;
    }

    .bag-legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
      width: 100%;
    }

    @media (max-width: 420px) {
      .bag-legend { grid-template-columns: 1fr; }
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-muted);
    }

    .legend-row .bag-badge {
      margin-left: 0;
      flex-shrink: 0;
    }

    .legend-row span {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.3;
      min-width: 0;
    }

    /* ========== Categories ========== */
    #list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 0;
    }

    .category {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s var(--ease);
    }

    .category[open] {
      border-color: color-mix(in srgb, var(--accent) 28%, var(--border));
    }

    .category summary {
      list-style: none;
      cursor: pointer;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
      min-height: var(--tap);
      padding: 14px 16px;
      user-select: none;
      transition: background 0.2s var(--ease);
    }

    .category summary::-webkit-details-marker { display: none; }

    .category summary:hover { background: var(--accent-soft); }

    .category summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .cat-title {
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: -0.01em;
    }

    .cat-count {
      font-size: 0.8125rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
      min-width: 3.2rem;
      text-align: center;
    }

    .chevron {
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      transition: transform 0.3s var(--ease);
    }

    .category[open] .chevron { transform: rotate(180deg); }

    .cat-note {
      margin: 0;
      padding: 0 16px 12px;
      font-size: 0.8125rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .cat-body {
      padding: 4px 8px 10px;
    }

    /* ========== Items ========== */
    .item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: var(--tap);
      padding: 8px 10px;
      margin: 1px 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      overflow: hidden;
      transition: background 0.15s var(--ease);
    }

    .item:hover { background: var(--bg-muted); }

    .item.is-checked {
      opacity: 0.55;
    }

    .item.is-checked .item-label {
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      text-decoration-color: color-mix(in srgb, var(--text-muted) 70%, transparent);
    }

    .item.is-leaving {
      animation: itemLeave 0.38s var(--ease) forwards;
      pointer-events: none;
    }

    .item.is-entering {
      animation: itemEnter 0.32s var(--ease);
    }

    @keyframes itemLeave {
      0% {
        opacity: 1;
        transform: translateX(0);
        max-height: 96px;
      }
      100% {
        opacity: 0;
        transform: translateX(14px);
        max-height: 0;
        margin-top: 0;
        margin-bottom: 0;
        padding-top: 0;
        padding-bottom: 0;
        min-height: 0;
      }
    }

    @keyframes itemEnter {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .item.is-hidden { display: none; }

    /* Custom checkbox */
    .item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      pointer-events: none;
    }

    .box {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid color-mix(in srgb, var(--accent) 55%, var(--border));
      background: var(--bg-elevated);
      display: grid;
      place-items: center;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .box svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s var(--ease), transform 0.25s var(--ease);
      color: #fff;
    }

    .item input:checked + .box {
      background: var(--accent);
      border-color: var(--accent);
    }

    .item input:checked + .box svg {
      opacity: 1;
      transform: scale(1);
    }

    .item input:focus-visible + .box {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .item .box {
      flex-shrink: 0;
      margin-top: 1px;
    }

    .item-label {
      display: block;
      font-size: 0.9375rem;
      transition: opacity 0.25s var(--ease), text-decoration-color 0.25s var(--ease);
    }

    .item-hint {
      display: block;
      margin-top: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .bag-badge {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .item > .bag-badge {
      align-self: center;
      margin-left: auto;
    }

    .bag-checkin {
      background: color-mix(in srgb, var(--accent) 14%, var(--bg-elevated));
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 25%, var(--border));
    }

    .bag-carryon {
      background: color-mix(in srgb, #8B6914 12%, var(--bg-elevated));
      color: #8B6914;
      border-color: color-mix(in srgb, #8B6914 28%, var(--border));
    }

    @media (prefers-color-scheme: dark) {
      .bag-carryon { color: #D4A843; }
    }

    .bag-personal {
      background: color-mix(in srgb, #5C4D8A 12%, var(--bg-elevated));
      color: #5C4D8A;
      border-color: color-mix(in srgb, #5C4D8A 25%, var(--border));
    }

    @media (prefers-color-scheme: dark) {
      .bag-personal { color: #A898D8; }
    }

    .bag-wear {
      background: color-mix(in srgb, #A63D3D 10%, var(--bg-elevated));
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 25%, var(--border));
    }

    .item-text {
      flex: 1;
      min-width: 0;
    }

    .btn-delete {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      display: grid;
      place-items: center;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);
    }

    .btn-delete:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-delete:active { transform: scale(0.92); }

    .btn-delete:focus-visible {
      outline: 2px solid var(--danger);
      outline-offset: 2px;
    }

    /* ========== Add custom item ========== */
    .add-row {
      display: flex;
      gap: 8px;
      padding: 8px 8px 4px;
      margin-top: 4px;
    }

    .add-row input[type="text"] {
      flex: 1;
      min-height: var(--tap);
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .add-row input[type="text"]::placeholder { color: var(--text-muted); }

    .add-row input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .btn-add {
      flex-shrink: 0;
      min-height: var(--tap);
      min-width: var(--tap);
      padding: 0 16px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s var(--ease), transform 0.15s var(--ease);
    }

    .btn-add:hover { background: var(--accent-hover); }
    .btn-add:active { transform: scale(0.97); }

    .btn-add:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .empty-filter {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      font-size: 0.9375rem;
      display: none;
    }

    .empty-filter.visible { display: block; }

    .footer-hint {
      margin-top: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .footer-reset {
      display: block;
      margin: 8px auto 0;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .footer-reset:hover { color: var(--danger); }

    /* Completion toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      z-index: 60;
      max-width: min(92vw, 360px);
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
      font-size: 0.9rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(31, 94, 74, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (prefers-color-scheme: dark) {
      .toast {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
    }

    /* ========== Reduced motion ========== */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .item.is-leaving {
        animation: none;
        opacity: 0;
        max-height: 0;
        margin: 0;
        padding: 0;
        min-height: 0;
      }
    }

    /* ========== Print ========== */
    @media print {
      body {
        background: #fff;
        color: #000;
      }

      .header {
        position: static;
        background: none;
        border: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .btn-reset,
      .toolbar,
      .add-row,
      .btn-delete,
      .footer-hint,
      .footer-reset,
      .chevron,
      .view-tabs {
        display: none !important;
      }

      .bag-badge {
        font-size: 0.6rem !important;
      }

      .category {
        break-inside: avoid;
        box-shadow: none;
        border-color: #ccc;
      }

      .category:not([open]) > *:not(summary) {
        display: block !important;
      }

      .category {
        open: true;
      }

      .cat-body { display: block !important; }
      .cat-note { display: block !important; }

      details.category {
        display: block;
      }

      details.category > summary ~ * {
        display: block !important;
      }

      details.category[open] > summary ~ *,
      details.category:not([open]) > summary ~ * {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
      }

      .progress-fill::after { display: none; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <h1>Saudi Trip Packing</h1>
          <p class="weather-note" id="weatherNote">22-day trip · Aug 40–48°C · Men's list</p>
        </div>
      </div>
      <div class="progress-block" aria-live="polite">
        <div class="progress-meta">
          <span id="progressText">0 of 0 packed</span>
          <span class="pct" id="progressPct">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </header>

    <div class="view-tabs" role="tablist" aria-label="Main views">
      <button type="button" class="view-tab" data-view="pack" role="tab" aria-pressed="true" aria-controls="packPanel">Checklist</button>
      <button type="button" class="view-tab" data-view="guide" role="tab" aria-pressed="false" aria-controls="guidePanel">Guide</button>
    </div>

    <div class="panel is-active" id="packPanel" role="tabpanel">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter items">
          <button type="button" class="filter-btn" data-filter="remaining" aria-pressed="true">To pack</button>
          <button type="button" class="filter-btn" data-filter="all" aria-pressed="false">All</button>
          <button type="button" class="filter-btn" data-filter="packed" aria-pressed="false">Done</button>
        </div>
        <button type="button" class="btn-details" id="detailsBtn" data-action="details" aria-pressed="false">Notes</button>
      </div>
      <div id="list"></div>
      <p class="empty-filter" id="emptyFilter">Nothing left in this filter — nice work.</p>
    </div>

    <div class="panel" id="guidePanel" role="tabpanel">
      <section class="packing-guide" id="packingGuide" aria-label="Packing guide"></section>
    </div>

    <p class="footer-hint">Progress saves on this device.</p>
    <button type="button" class="footer-reset" data-action="reset">Reset all progress</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>All packed — safe travels!</div>

  <script>
    /**
     * Saudi Trip packing checklist
     * - Stable slug IDs from category + label
     * - Checked state in localStorage key `saudi-packing-v1`
     * - Custom items in `saudi-packing-custom-v1`
     * - Single event-delegation listener on #app
     */

    (function () {
      "use strict";

      // ----- Constants -----
      var STORAGE_KEY = "saudi-packing-v1";
      var CUSTOM_KEY = "saudi-packing-custom-v1";
      var DETAILS_KEY = "saudi-packing-details-v1";
      var VIEW_KEY = "saudi-packing-view-v1";
      var TRIP_DAYS = 22;

      /** Short bag labels shown on every item */
      var BAG_LABELS = {
        checkin: "Check-in",
        carryon: "Carry-on",
        personal: "Personal",
        wear: "Wear"
      };

      var BAG_SHORT = {
        checkin: "30 kg",
        carryon: "7 kg",
        personal: "3 kg",
        wear: "Wear"
      };

      /** Built-in packing catalogue — items may be strings or { label, bag, hint } */
      var CATEGORIES = [
        {
          id: "bag-plan",
          title: "Bag Plan — Pack These First",
          note: "22-day trip — tick each bag when packed. Plan one laundry run around day 10–11 to stay under 30 kg.",
          items: [
            { label: "Check-in suitcase packed (target ≤30 kg)", bag: "checkin", hint: "Bulk clothing, spare shoes, Ihram sets, toiletries — sized for 22 days with mid-trip laundry" },
            { label: "Hand-carry bag packed (target ≤7 kg)", bag: "carryon", hint: "Laptop, chargers, docs, 2 spare outfits, meds, Haram daypack" },
            { label: "Personal item packed (target ≤3 kg)", bag: "personal", hint: "Wallet, passport pouch, phone, in-flight snacks, lip balm" },
            { label: "Weigh check-in bag on bathroom scales", bag: "checkin", hint: "Aim for 28–29 kg — you'll add snacks and last-minute picks" },
            { label: "Book / plan laundry for ~day 10–11", bag: "checkin", hint: "Hotel laundry or laundromat — refreshes half your wardrobe for the second half" },
            { label: "Heaviest walking shoes ON FEET for flight", bag: "wear", hint: "Saves ~0.8 kg in the suitcase" },
            { label: "Blazer or light jacket ON PERSON for flight", bag: "wear", hint: "Counts as worn clothing, not bag weight" }
          ]
        },
        {
          id: "wardrobe-plan",
          title: "Men's Wardrobe — 22-Day Quantities",

          items: [
            { label: "Formal shirts ×6 (pick 3 white, 2 blue, 1 stripe)", bag: "checkin", hint: "~3 business blocks across 22 days — rotate, don't wear all" },
            { label: "Formal shirts ×2 spare in hand carry", bag: "carryon", hint: "Backup if checked bag delayed + fresh for key meetings" },
            { label: "Formal trousers ×3 (charcoal, navy, +1 spare)", bag: "checkin", hint: "Rotate all trip; 3 pairs covers 22 days with laundry" },
            { label: "Suit or blazer ×1", bag: "wear", hint: "Wear on plane OR fold in garment bag in check-in" },
            { label: "Tie ×2 (conservative colours)", bag: "checkin", hint: "One on, one spare" },
            { label: "Dress shoes ×1 pair", bag: "wear", hint: "Wear on plane — heaviest formal shoes" },
            { label: "Loose cotton long-sleeve shirts ×8", bag: "checkin", hint: "Umrah exit, mosque, heat — light colours, knee-covering trousers with these" },
            { label: "Plain T-shirts ×7 (no logos / graphics)", bag: "checkin", hint: "Hotel, gym, under layers — not for Haram outerwear" },
            { label: "Long trousers ×5 (casual / Umrah)", bag: "checkin", hint: "Lightweight cotton; cover ankles for mosque visits" },
            { label: "Light jacket ×1", bag: "carryon", hint: "Freezing A/C in malls & hotels" },
            { label: "Thobe or kurta ×2", bag: "checkin", hint: "Comfortable for mosque / evening leisure in the heat" },
            { label: "Underwear ×14", bag: "checkin", hint: "22-day buffer: 7 on, 7 clean, laundry at day 10–11" },
            { label: "Socks ×14 pairs", bag: "checkin", hint: "Include 3 thin pairs for dress shoes; heat = fresh socks daily" },
            { label: "Walking shoes — pair #1 (wear on plane)", bag: "wear", hint: "Broken-in; your best walkers for 22 days" },
            { label: "Walking shoes — pair #2 (check-in)", bag: "checkin", hint: "Spare when pair #1 gets dusty at Haram" },
            { label: "Flip-flops ×1 (hotel / shower)", bag: "checkin", hint: "Light — bottom of suitcase" },
            { label: "Seamless sandals ×1 (Ihram / Haram)", bag: "carryon", hint: "Must stay accessible for Umrah" },
            { label: "Belt ×1 (formal)", bag: "checkin", hint: "Match formal trousers" },
            { label: "Outfit pick for Day 1 on body", bag: "wear", hint: "Smart-casual that works for airport + arrival" },
            { label: "Travel-size laundry detergent / sheets ×1", bag: "checkin", hint: "Emergency sink-wash between hotel laundry runs" }
          ]
        },
        {
          id: "documents-admin",
          title: "Documents & Admin",
          items: [
            { label: "Passport (6+ months validity)", bag: "personal", hint: "Keep on you — never check-in" },
            { label: "Visa / Nusuk permit printout", bag: "carryon", hint: "Original + photocopy" },
            { label: "Flight confirmations", bag: "personal" },
            { label: "Hotel bookings", bag: "carryon" },
            { label: "Travel insurance", bag: "carryon" },
            { label: "Business cards", bag: "personal" },
            { label: "SAR cash", bag: "personal" },
            { label: "International debit/credit card", bag: "personal" },
            { label: "Photocopies of all documents", bag: "checkin", hint: "Spare set in suitcase" }
          ]
        },
        {
          id: "ihram-umrah",
          title: "Ihram & Umrah",
          note: "Scented products break ihram — check every label.",
          items: [
            { label: "Ihram set #1", bag: "checkin" },
            { label: "Ihram set #2 (spare)", bag: "checkin" },
            { label: "Ihram belt with pouch", bag: "carryon", hint: "Keep with sandals for quick change" },
            { label: "Seamless sandals", bag: "carryon" },
            { label: "Unscented soap", bag: "checkin" },
            { label: "Unscented shampoo", bag: "checkin" },
            { label: "Unscented toothpaste", bag: "checkin" },
            { label: "Unscented deodorant", bag: "checkin" },
            { label: "Unscented sunscreen", bag: "carryon" },
            { label: "Unscented lip balm", bag: "personal" },
            { label: "Small prayer mat", bag: "carryon" },
            { label: "Tasbeeh", bag: "personal" },
            { label: "Drawstring shoe bag for the Haram", bag: "carryon" },
            { label: "Nail clippers", bag: "checkin" },
            { label: "Razor or scissors for halq / taqsir", bag: "checkin", hint: "Men's hair/beard trim after Umrah" }
          ]
        },
        {
          id: "business",
          title: "Business Kit",
          note: "Keep tech & presentation materials in hand carry — never check-in.",
          items: [
            { label: "Laptop", bag: "carryon" },
            { label: "Laptop charger", bag: "carryon" },
            { label: "Phone", bag: "personal" },
            { label: "Phone charger", bag: "carryon" },
            { label: "Power bank", bag: "carryon", hint: "Airline rules: usually in hand carry only" },
            { label: "Presentation materials", bag: "carryon" },
            { label: "Type G plug adapter", bag: "carryon" },
            { label: "Document folder", bag: "carryon" }
          ]
        },
        {
          id: "health-kit",
          title: "Health Kit",
          items: [
            { label: "Prescription meds in original packaging", bag: "carryon", hint: "Full 22+ day supply — never check-in" },
            { label: "Copy of prescription", bag: "carryon" },
            { label: "Oral rehydration salts", bag: "carryon", hint: "Critical in 40°C+ over 3 weeks" },
            { label: "Painkillers", bag: "carryon" },
            { label: "Anti-diarrhoeal", bag: "checkin" },
            { label: "Throat lozenges", bag: "personal" },
            { label: "Antihistamine", bag: "checkin" },
            { label: "Blister plasters", bag: "carryon" },
            { label: "Vaseline for chafing", bag: "checkin" },
            { label: "Antiseptic cream", bag: "checkin" },
            { label: "Hand sanitiser", bag: "personal" },
            { label: "Face masks", bag: "carryon" }
          ]
        },
        {
          id: "practical",
          title: "Practical",
          items: [
            { label: "Tehzeeb biscuit box", bag: "carryon", hint: "Priority snack — don't bury in check-in" },
            { label: "Almond biscotti", bag: "carryon", hint: "Priority snack — share on plane" },
            { label: "Universal adapter", bag: "checkin" },
            { label: "Extension lead", bag: "checkin" },
            { label: "Small backpack for the Haram", bag: "carryon", hint: "Empty/folded in hand carry; pack daily inside" },
            { label: "Small backpack for chappals", bag: "checkin" },
            { label: "Sunglasses", bag: "personal" },
            { label: "Cap", bag: "carryon" },
            { label: "Travel towel", bag: "checkin" },
            { label: "Eye mask", bag: "personal" },
            { label: "Earplugs", bag: "personal" }
          ]
        }
      ];

      // Checkmark SVG reused for every custom checkbox face
      var CHECK_SVG =
        '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<path fill="currentColor" d="M9.2 16.6 4.8 12.2l1.4-1.4 3 3 8-8 1.4 1.4z"/>' +
        "</svg>";

      var CHEVRON_SVG =
        '<svg class="chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<path fill="currentColor" d="M7.4 9.4 12 14l4.6-4.6L18 10.8l-6 6-6-6z"/>' +
        "</svg>";

      // ----- State -----
      var checkedMap = loadChecked();
      var customMap = loadCustom();
      var currentFilter = "remaining"; // remaining | all | packed
      var showDetails = loadDetails();
      var currentView = loadView();

      // ----- DOM refs -----
      var appEl = document.getElementById("app");
      var guideEl = document.getElementById("packingGuide");
      var listEl = document.getElementById("list");
      var packPanel = document.getElementById("packPanel");
      var guidePanel = document.getElementById("guidePanel");
      var detailsBtn = document.getElementById("detailsBtn");
      var progressText = document.getElementById("progressText");
      var progressPct = document.getElementById("progressPct");
      var progressFill = document.getElementById("progressFill");
      var progressBar = document.getElementById("progressBar");
      var emptyFilter = document.getElementById("emptyFilter");
      var toastEl = document.getElementById("toast");
      var toastTimer = null;
      var celebrated = false;

      // ----- Helpers -----

      /** Slugify text for stable IDs that survive reordering. */
      function slugify(text) {
        return String(text)
          .toLowerCase()
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/&/g, "and")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      /** Stable item id: categorySlug + itemSlug */
      function itemId(categoryId, label) {
        return categoryId + "__" + slugify(label);
      }

      function loadChecked() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return {};
          var parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (e) {
          return {};
        }
      }

      function saveChecked() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedMap));
      }

      function loadCustom() {
        try {
          var raw = localStorage.getItem(CUSTOM_KEY);
          if (!raw) return {};
          var parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (e) {
          return {};
        }
      }

      function saveCustom() {
        localStorage.setItem(CUSTOM_KEY, JSON.stringify(customMap));
      }

      function loadDetails() {
        try {
          return localStorage.getItem(DETAILS_KEY) === "1";
        } catch (e) {
          return false;
        }
      }

      function saveDetails() {
        localStorage.setItem(DETAILS_KEY, showDetails ? "1" : "0");
      }

      function loadView() {
        try {
          var v = localStorage.getItem(VIEW_KEY);
          return v === "guide" ? "guide" : "pack";
        } catch (e) {
          return "pack";
        }
      }

      function saveView() {
        localStorage.setItem(VIEW_KEY, currentView);
      }

      function applyDetailsUi() {
        appEl.classList.toggle("details-on", showDetails);
        if (detailsBtn) {
          detailsBtn.setAttribute("aria-pressed", showDetails ? "true" : "false");
          detailsBtn.textContent = showDetails ? "Hide notes" : "Notes";
        }
      }

      function setView(next) {
        currentView = next;
        saveView();
        document.querySelectorAll(".view-tab").forEach(function (btn) {
          var on = btn.getAttribute("data-view") === next;
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
        if (packPanel) {
          packPanel.classList.toggle("is-active", next === "pack");
        }
        if (guidePanel) {
          guidePanel.classList.toggle("is-active", next === "guide");
        }
      }

      function toggleDetails() {
        showDetails = !showDetails;
        saveDetails();
        applyDetailsUi();
      }

      /** Open first category that still has unpacked visible items */
      function openFirstIncomplete() {
        var sections = listEl.querySelectorAll("details.category");
        var opened = false;
        sections.forEach(function (section) {
          if (opened) {
            section.open = false;
            return;
          }
          var items = section.querySelectorAll(visibleItemSelector());
          var hasRemaining = false;
          items.forEach(function (row) {
            if (!row.classList.contains("is-checked")) hasRemaining = true;
          });
          if (hasRemaining && items.length) {
            section.open = true;
            opened = true;
          } else {
            section.open = false;
          }
        });
        if (!opened && sections[0]) sections[0].open = true;
      }

      /** Accordion — one open category at a time (bound once) */
      var accordionBound = false;
      function bindAccordion() {
        if (accordionBound) return;
        accordionBound = true;
        listEl.addEventListener("toggle", function (e) {
          var section = e.target;
          if (!section.matches || !section.matches("details.category") || !section.open) return;
          listEl.querySelectorAll("details.category").forEach(function (other) {
            if (other !== section) other.open = false;
          });
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      /** Normalize string or object item entries */
      function normalizeEntry(entry) {
        if (typeof entry === "string") {
          return { label: entry, bag: null, hint: null };
        }
        return {
          label: entry.label,
          bag: entry.bag || null,
          hint: entry.hint || null
        };
      }

      function renderBagBadge(bag, compact) {
        if (!bag || !BAG_LABELS[bag]) return "";
        var label = compact && BAG_SHORT[bag] ? BAG_SHORT[bag] : BAG_LABELS[bag];
        return (
          '<span class="bag-badge bag-' +
          escapeHtml(bag) +
          '" title="' +
          escapeHtml(BAG_LABELS[bag]) +
          '">' +
          escapeHtml(label) +
          "</span>"
        );
      }

      /** Static packing coach panel (allowance + wardrobe snapshot) */
      function renderGuide() {
        if (!guideEl) return;
        var weatherEl = document.getElementById("weatherNote");
        if (weatherEl) {
          weatherEl.textContent = TRIP_DAYS + "-day trip · Aug 40–48°C · Men's list";
        }
        guideEl.innerHTML =
          '<div class="guide-card">' +
          '<div class="guide-section">' +
          "<h2>" + TRIP_DAYS + "-day luggage</h2>" +
          "<p>30 kg check-in · 7 kg carry · 3 kg personal. Laundry around day 10–11.</p>" +
          '<div class="allowance-grid">' +
          '<div class="allowance-pill"><strong>30 kg</strong><span>Check-in</span></div>' +
          '<div class="allowance-pill"><strong>7 kg</strong><span>Hand carry</span></div>' +
          '<div class="allowance-pill"><strong>3 kg</strong><span>Personal</span></div>' +
          "</div>" +
          '<p class="guide-tip">Wear dress shoes + heaviest walkers + blazer on the plane. Pack ~12–14 days of clothes, then laundry mid-trip.</p>' +
          "</div>" +
          '<div class="guide-section">' +
          "<h2>Men's wardrobe counts</h2>" +
          "<p>Bring options — pick outfits daily.</p>" +
          '<div class="wardrobe-grid">' +
          '<div class="wardrobe-stat"><span>Formal shirts</span><em>6+2</em></div>' +
          '<div class="wardrobe-stat"><span>Formal trousers</span><em>3</em></div>' +
          '<div class="wardrobe-stat"><span>Cotton shirts</span><em>8</em></div>' +
          '<div class="wardrobe-stat"><span>T-shirts</span><em>7</em></div>' +
          '<div class="wardrobe-stat"><span>Casual trousers</span><em>5</em></div>' +
          '<div class="wardrobe-stat"><span>Thobe / kurta</span><em>2</em></div>' +
          '<div class="wardrobe-stat"><span>Shoes</span><em>4 pr</em></div>' +
          '<div class="wardrobe-stat"><span>Underwear / socks</span><em>14</em></div>' +
          "</div>" +
          '<div class="bag-legend">' +
          renderBagBadge("checkin") +
          renderBagBadge("carryon") +
          renderBagBadge("personal") +
          renderBagBadge("wear") +
          "</div>" +
          "</div>" +
          "</div>";
      }

      /** Collect every item (built-in + custom) for a category. */
      function getCategoryItems(cat) {
        var builtIn = cat.items.map(function (entry) {
          var norm = normalizeEntry(entry);
          return {
            id: itemId(cat.id, norm.label),
            label: norm.label,
            bag: norm.bag,
            hint: norm.hint,
            custom: false
          };
        });
        var customs = (customMap[cat.id] || []).map(function (entry) {
          return {
            id: entry.id,
            label: entry.label,
            bag: entry.bag || null,
            hint: entry.hint || null,
            custom: true
          };
        });
        return builtIn.concat(customs);
      }

      function itemMatchesFilter(isChecked) {
        if (currentFilter === "remaining") return !isChecked;
        if (currentFilter === "packed") return isChecked;
        return true;
      }

      /** Visible item selector — excludes animating-out rows */
      function visibleItemSelector() {
        return ".item:not(.is-hidden):not(.is-leaving)";
      }

      function prefersReducedMotion() {
        return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      function refreshSectionVisibility(section) {
        if (!section) return;
        if (currentFilter === "all") {
          section.style.display = "";
          return;
        }
        var any = section.querySelector(visibleItemSelector());
        section.style.display = any ? "" : "none";
      }

      function finishLeave(row) {
        row.classList.remove("is-leaving");
        row.classList.add("is-hidden");
        refreshSectionVisibility(row.closest(".category"));
        updateEmptyState();
      }

      /** Show or hide a row — animate when toggling a single item */
      function setItemVisibility(row, show, animate) {
        if (!row) return;
        if (show) {
          row.classList.remove("is-hidden", "is-leaving");
          row.classList.add("is-entering");
          row.addEventListener("animationend", function (e) {
            if (e.animationName === "itemEnter") row.classList.remove("is-entering");
          }, { once: true });
          refreshSectionVisibility(row.closest(".category"));
          updateEmptyState();
          return;
        }
        if (row.classList.contains("is-hidden") || row.classList.contains("is-leaving")) return;
        if (!animate || prefersReducedMotion()) {
          row.classList.add("is-hidden");
          refreshSectionVisibility(row.closest(".category"));
          updateEmptyState();
          return;
        }
        setTimeout(function () {
          if (row.classList.contains("is-hidden")) return;
          row.classList.add("is-leaving");
          row.addEventListener("animationend", function (e) {
            if (e.animationName !== "itemLeave") return;
            finishLeave(row);
          }, { once: true });
          setTimeout(function () {
            if (row.classList.contains("is-leaving")) finishLeave(row);
          }, 480);
        }, 120);
      }

      // ----- Render -----

      function renderItem(item, isChecked) {
        var hidden = itemMatchesFilter(isChecked) ? "" : " is-hidden";
        var checkedClass = isChecked ? " is-checked" : "";
        var checkedAttr = isChecked ? " checked" : "";
        var deleteBtn = item.custom
          ? '<button type="button" class="btn-delete" data-action="delete" data-id="' +
            escapeHtml(item.id) +
            '" aria-label="Delete ' +
            escapeHtml(item.label) +
            '">×</button>'
          : "";

        return (
          '<div class="item' +
          checkedClass +
          hidden +
          '" data-id="' +
          escapeHtml(item.id) +
          '" data-action="toggle">' +
          '<input type="checkbox" id="' +
          escapeHtml(item.id) +
          '"' +
          checkedAttr +
          ' tabindex="0" />' +
          '<span class="box" aria-hidden="true">' +
          CHECK_SVG +
          "</span>" +
          '<div class="item-text">' +
          '<label class="item-label" for="' +
          escapeHtml(item.id) +
          '">' +
          escapeHtml(item.label) +
          "</label>" +
          (item.hint ? '<span class="item-hint">' + escapeHtml(item.hint) + "</span>" : "") +
          "</div>" +
          renderBagBadge(item.bag, true) +
          deleteBtn +
          "</div>"
        );
      }

      function renderCategory(cat, index) {
        var items = getCategoryItems(cat);
        var packed = 0;
        items.forEach(function (it) {
          if (checkedMap[it.id]) packed += 1;
        });

        var visibleCount = 0;
        var itemsHtml = items
          .map(function (it) {
            var on = !!checkedMap[it.id];
            if (itemMatchesFilter(on)) visibleCount += 1;
            return renderItem(it, on);
          })
          .join("");

        // Hide whole section when filter yields no rows
        var sectionHidden = visibleCount === 0 && currentFilter !== "all" ? ' style="display:none"' : "";

        var noteHtml = cat.note
          ? '<p class="cat-note">' + escapeHtml(cat.note) + "</p>"
          : "";

        return (
          '<details class="category" data-cat="' +
          escapeHtml(cat.id) +
          '"' +
          sectionHidden +
          ">" +
          "<summary>" +
          '<span class="cat-title">' +
          escapeHtml(cat.title) +
          "</span>" +
          '<span class="cat-count" data-cat-count="' +
          escapeHtml(cat.id) +
          '">' +
          packed +
          "/" +
          items.length +
          "</span>" +
          CHEVRON_SVG +
          "</summary>" +
          noteHtml +
          '<div class="cat-body" data-items="' +
          escapeHtml(cat.id) +
          '">' +
          itemsHtml +
          "</div>" +
          '<form class="add-row" data-action="add" data-cat="' +
          escapeHtml(cat.id) +
          '">' +
          '<input type="text" name="label" placeholder="Add custom item…" maxlength="120" autocomplete="off" />' +
          '<button type="submit" class="btn-add" aria-label="Add item to ' +
          escapeHtml(cat.title) +
          '">Add</button>' +
          "</form>" +
          "</details>"
        );
      }

      function renderAll() {
        listEl.innerHTML = CATEGORIES.map(renderCategory).join("");
        applyFilter();
        bindAccordion();
        openFirstIncomplete();
        updateProgress();
        updateEmptyState();
      }

      function updateEmptyState() {
        var anyVisible = listEl.querySelector(visibleItemSelector());
        emptyFilter.classList.toggle("visible", !anyVisible && currentFilter !== "all");
      }

      function updateProgress() {
        var total = 0;
        var packed = 0;

        CATEGORIES.forEach(function (cat) {
          var items = getCategoryItems(cat);
          var catPacked = 0;
          items.forEach(function (it) {
            total += 1;
            if (checkedMap[it.id]) {
              packed += 1;
              catPacked += 1;
            }
          });
          var countEl = listEl.querySelector('[data-cat-count="' + cat.id + '"]');
          if (countEl) countEl.textContent = catPacked + "/" + items.length;
        });

        var pct = total === 0 ? 0 : Math.round((packed / total) * 100);
        progressText.textContent = packed + " of " + total + " packed";
        progressPct.textContent = pct + "%";
        progressFill.style.width = pct + "%";
        progressBar.setAttribute("aria-valuenow", String(pct));

        if (total > 0 && packed === total) {
          if (!celebrated) {
            celebrated = true;
            showToast("All packed — safe travels!");
          }
        } else {
          celebrated = false;
        }
      }

      function showToast(message) {
        if (!toastEl) return;
        toastEl.textContent = message;
        toastEl.hidden = false;
        // Force reflow so the transition plays
        void toastEl.offsetWidth;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove("show");
          setTimeout(function () { toastEl.hidden = true; }, 350);
        }, 2800);
      }

      /** Apply filter without full re-render (keeps open/closed & input focus). */
      function applyFilter() {
        CATEGORIES.forEach(function (cat) {
          var section = listEl.querySelector('.category[data-cat="' + cat.id + '"]');
          if (!section) return;
          var visible = 0;
          section.querySelectorAll(".item").forEach(function (row) {
            var id = row.getAttribute("data-id");
            var on = !!checkedMap[id];
            var show = itemMatchesFilter(on);
            row.classList.toggle("is-hidden", !show);
            if (show) visible += 1;
          });
          section.style.display = visible === 0 && currentFilter !== "all" ? "none" : "";
        });
        updateEmptyState();
      }

      function setFilter(next) {
        currentFilter = next;
        document.querySelectorAll(".filter-btn").forEach(function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-filter") === next ? "true" : "false");
        });
        applyFilter();
        openFirstIncomplete();
      }

      function toggleItem(id) {
        checkedMap[id] = !checkedMap[id];
        saveChecked();

        var row = listEl.querySelector('.item[data-id="' + cssEscape(id) + '"]');
        if (row) {
          var input = row.querySelector('input[type="checkbox"]');
          var on = !!checkedMap[id];
          if (input) input.checked = on;
          row.classList.toggle("is-checked", on);
          var show = itemMatchesFilter(on);
          setItemVisibility(row, show, true);
        }
        updateProgress();
      }

      /** Minimal CSS.escape polyfill for attribute selectors */
      function cssEscape(value) {
        if (window.CSS && typeof CSS.escape === "function") return CSS.escape(value);
        return String(value).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
      }

      function addCustomItem(categoryId, label) {
        label = String(label || "").trim();
        if (!label) return;

        var id = itemId(categoryId, label);
        // Avoid duplicates within category
        var existsBuiltIn = CATEGORIES.some(function (c) {
          return c.id === categoryId && c.items.some(function (t) {
            return itemId(c.id, normalizeEntry(t).label) === id;
          });
        });
        var customs = customMap[categoryId] || [];
        var existsCustom = customs.some(function (e) { return e.id === id; });
        if (existsBuiltIn || existsCustom) {
          // If it already exists, just focus / flash that row
          var existing = listEl.querySelector('.item[data-id="' + cssEscape(id) + '"]');
          if (existing) {
            existing.scrollIntoView({ behavior: "smooth", block: "center" });
            existing.style.outline = "2px solid var(--accent)";
            setTimeout(function () { existing.style.outline = ""; }, 900);
          }
          return;
        }

        customs.push({ id: id, label: label, bag: "checkin" });
        customMap[categoryId] = customs;
        saveCustom();
        renderAll();
        var row = listEl.querySelector('.item[data-id="' + cssEscape(id) + '"]');
        if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      function deleteCustomItem(id) {
        Object.keys(customMap).forEach(function (catId) {
          customMap[catId] = (customMap[catId] || []).filter(function (e) {
            return e.id !== id;
          });
          if (!customMap[catId].length) delete customMap[catId];
        });
        delete checkedMap[id];
        saveCustom();
        saveChecked();
        renderAll();
      }

      function resetAll() {
        var ok = window.confirm("Reset all packing progress? This cannot be undone.");
        if (!ok) return;
        checkedMap = {};
        localStorage.removeItem(STORAGE_KEY);
        // Keep custom items; only clear checked state as requested
        renderAll();
      }

      // Force-open all details when printing (registered once)
      window.addEventListener("beforeprint", function () {
        listEl.querySelectorAll("details.category").forEach(function (d) {
          d.setAttribute("data-was-open", d.open ? "1" : "0");
          d.open = true;
        });
      });
      window.addEventListener("afterprint", function () {
        listEl.querySelectorAll("details.category").forEach(function (d) {
          if (d.getAttribute("data-was-open") === "0") d.open = false;
          d.removeAttribute("data-was-open");
        });
      });

      // ----- Event delegation -----
      appEl.addEventListener("click", function (e) {
        var target = e.target;

        // Filter buttons
        var filterBtn = target.closest(".filter-btn");
        if (filterBtn && appEl.contains(filterBtn)) {
          setFilter(filterBtn.getAttribute("data-filter"));
          return;
        }

        // View tabs
        var viewTab = target.closest(".view-tab");
        if (viewTab && appEl.contains(viewTab)) {
          setView(viewTab.getAttribute("data-view"));
          return;
        }

        // Details toggle
        if (target.closest('[data-action="details"]')) {
          toggleDetails();
          return;
        }

        // Reset
        if (target.closest('[data-action="reset"]')) {
          resetAll();
          return;
        }

        // Delete custom item (stop row toggle)
        var del = target.closest('[data-action="delete"]');
        if (del) {
          e.preventDefault();
          e.stopPropagation();
          deleteCustomItem(del.getAttribute("data-id"));
          return;
        }

        // Toggle via row click (but not when clicking summary/add form)
        var row = target.closest('.item[data-action="toggle"]');
        if (row && !target.closest("summary") && !target.closest(".add-row")) {
          // If they clicked the native checkbox/label, still sync via our handler
          e.preventDefault();
          toggleItem(row.getAttribute("data-id"));
        }
      });

      // Keyboard: Space/Enter on focused checkbox already works;
      // also sync change events from keyboard activation
      appEl.addEventListener("change", function (e) {
        var input = e.target;
        if (input && input.matches('input[type="checkbox"]')) {
          var row = input.closest(".item");
          if (!row) return;
          var id = row.getAttribute("data-id");
          // Align map to checkbox (preventDefault on click means we manage it;
          // change from keyboard may fire with new state already flipped)
          checkedMap[id] = input.checked;
          saveChecked();
          row.classList.toggle("is-checked", input.checked);
          var show = itemMatchesFilter(input.checked);
          setItemVisibility(row, show, true);
          updateProgress();
        }
      });

      appEl.addEventListener("submit", function (e) {
        var form = e.target.closest('form[data-action="add"]');
        if (!form) return;
        e.preventDefault();
        var input = form.querySelector('input[name="label"]');
        var catId = form.getAttribute("data-cat");
        addCustomItem(catId, input.value);
        input.value = "";
        input.focus();
      });

      // ----- Boot -----
      renderGuide();
      applyDetailsUi();
      setView(currentView);
      renderAll();
    })();
  </script>
</body>
</html>
